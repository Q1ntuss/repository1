{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">

  <!-- Leave feedback -->
  <div class="bg-white p-8 rounded-2xl shadow-md mb-12">
    <h2 class="text-3xl font-extrabold mb-6 bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">
      Залишити відгук
    </h2>

    <form method="POST" class="space-y-5">
      <div>
        <label class="block mb-1 font-medium text-gray-700">Ім’я</label>
        <input type="text" name="name" required
               class="w-full p-3 border border-gray-300 rounded-xl
                      focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">Повідомлення</label>
        <textarea name="message" required rows="4"
                  class="w-full p-3 border border-gray-300 rounded-xl
                         focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
      </div>

      <button type="submit"
              class="w-full py-3 rounded-xl text-white font-semibold
                     bg-gradient-to-r from-green-400 to-green-600
                     hover:from-green-500 hover:to-green-700 transition">
        Надіслати відгук
      </button>
    </form>
  </div>

  <!-- Feedback list -->
  <div>
    <h3 class="text-2xl font-bold mb-6">
      Відгуки клієнтів
    </h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      {% for f in feedbacks %}
      <div class="bg-white rounded-2xl border shadow-sm p-6 hover:shadow-lg transition">

        <div class="flex items-center mb-4">
          <!-- Avatar -->
          <div class="w-12 h-12 rounded-full bg-gradient-to-r from-green-400 to-green-600
                      flex items-center justify-center text-white font-bold text-lg mr-4">
            {{ f.name[0] }}
          </div>

          <div>
            <p class="font-semibold">{{ f.name }}</p>
            <p class="text-gray-500 text-sm">
              {{ f.created_at }}
            </p>
          </div>
        </div>

        <p class="text-gray-700 leading-relaxed">
          {{ f.message }}
        </p>
      </div>
      {% endfor %}

      {% if feedbacks|length == 0 %}
      <p class="text-gray-500">
        Поки що немає відгуків. Будьте першим 🙂
      </p>
      {% endif %}
    </div>
  </div>

</div>
{% endblock %}
