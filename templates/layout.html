<!-- templates/layout.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}My Shop{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    nav a { margin-right: 10px; }
    .card { border: 1px solid #6a2626; padding: 10px; margin: 10px 0; border-radius: 6px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Головна</a>
    <a href="{{ url_for('shop') }}">Магазин</a>
    <a href="{{ url_for('feedback.feedback') }}">Відгуки</a>
    <a href="{{ url_for('admin.admin') }}">Адмін</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
