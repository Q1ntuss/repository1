{% extends "base.html" %}

{% block title %}Додати продукт{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">Додати новий продукт</h1>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <input 
            type="text" 
            name="name" 
            placeholder="Назва продукту" 
            required 
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
        >
        <input 
            type="text" 
            name="description" 
            placeholder="Опис продукту" 
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
        >
        <input 
            type="number" 
            step="0.01" 
            name="price" 
            placeholder="Ціна" 
            required 
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
        >
        <input 
            type="number" 
            name="stock" 
            placeholder="Кількість" 
            required 
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
        >
        <input 
            type="file" 
            name="image" 
            accept="image/*"
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
        >
        <button 
            type="submit" 
            class="w-full py-3 rounded-xl text-white font-bold bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 
                   hover:from-blue-600 hover:via-blue-700 hover:to-blue-800 shadow-lg hover:shadow-xl transition-all">
            Додати
        </button>
    </form>
</div>
{% endblock %}
