{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">Реєстрація</h1>
    <form method="POST" class="space-y-4">
        <input type="email" name="email" placeholder="Email" required
               class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
        <input type="password" name="password" placeholder="Пароль" required
               class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
        <input type="password" name="confirm_password" placeholder="Підтвердження паролю" required
               class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
        <button type="submit" class="w-full py-3 rounded-xl text-white font-bold bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 
               hover:from-blue-600 hover:via-blue-700 hover:to-blue-800 shadow-lg hover:shadow-xl transition-all">
            Зареєструватися
        </button>
    </form>
    <p class="mt-4 text-center text-gray-600">Вже є акаунт? 
       <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Увійти</a>
    </p>
</div>
{% endblock %}
