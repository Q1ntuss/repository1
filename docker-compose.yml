services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_app
    env_file: .env
    volumes:
      - ./instance:/app/instance
      - ./static:/app/static
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static
    depends_on:
      - web
    restart: unless-stopped