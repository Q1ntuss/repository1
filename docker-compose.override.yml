services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flask_app_dev
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - .:/app
      - ./instance:/app/instance
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
    command: flask run --host=0.0.0.0 --port=5000 --reload